<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa Tech - Gestão de Participantes & Equipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #060b17;
      --bg-surface: #0c162d;
      --bg-card: rgba(13, 27, 56, 0.7);
      --border-blue: rgba(0, 195, 255, 0.25);
      --border-blue-hover: rgba(0, 240, 255, 0.6);
      
      --neon-cyan: #00f0ff;
      --neon-blue: #0077ff;
      --neon-green: #00ffaa;
      --neon-amber: #ffaa00;
      
      --text-main: #f0f6fc;
      --text-muted: #8ba2c4;
      
      --status-convocado: #00e5ff;
      --status-sem-equipe: #ffb703;
      --status-ausente: #64748b;
      --status-org: #f59e0b;

      /* Cores por turma */
      --tag-ec2: #00f0ff;
      --tag-ec4: #38bdf8;
      --tag-ec6: #818cf8;
      --tag-si2: #00ffaa;
      --tag-si4: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(0, 119, 255, 0.22) 0%, transparent 65%),
        radial-gradient(circle at 10% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 102, 204, 0.1) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem 3rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .badge-sub {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.3rem, 5.5vw, 3.8rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.7),
        0 0 20px var(--neon-cyan),
        0 0 40px var(--neon-blue);
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-blue);
      color: var(--text-muted);
      padding: 0.75rem 1.8rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .tab-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-blue);
      border-radius: 12px;
      padding: 0.9rem;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--border-blue);
    }

    .stat-card.convocados::before { background: var(--status-convocado); }
    .stat-card.sem-equipe::before { background: var(--status-sem-equipe); }
    .stat-card.organizacao::before { background: var(--status-org); }
    .stat-card.ausentes::before { background: var(--status-ausente); }

    .stat-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-card.convocados .stat-number { color: var(--status-convocado); }
    .stat-card.sem-equipe .stat-number { color: var(--status-sem-equipe); }
    .stat-card.organizacao .stat-number { color: var(--status-org); }
    .stat-card.ausentes .stat-number { color: var(--status-ausente); }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .controls-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-blue);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 1.8rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .search-input {
      width: 100%;
      background: rgba(4, 9, 22, 0.85);
      border: 1px solid var(--border-blue);
      border-radius: 8px;
      padding: 0.85rem 1.2rem;
      font-size: 1.05rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      color: #fff;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
    }

    .filter-groups {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(0, 195, 255, 0.15);
      padding-top: 1rem;
    }

    .filter-section {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 0.2rem;
    }

    .btn-filter, .select-filter {
      background: rgba(13, 27, 56, 0.9);
      border: 1px solid var(--border-blue);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-filter:hover, .select-filter:hover {
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .btn-filter.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .select-filter option {
      background: #060b17;
      color: #fff;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.1rem;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-blue);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .player-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-blue-hover);
      box-shadow: 0 8px 25px rgba(0, 119, 255, 0.18);
    }

    .player-card.status-convocado { border-left: 4px solid var(--status-convocado); }
    .player-card.status-sem-equipe { border-left: 4px solid var(--status-sem-equipe); }
    .player-card.status-org { border-left: 4px solid var(--status-org); }
    .player-card.status-ausente { border-left: 4px solid var(--status-ausente); opacity: 0.65; }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .player-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: 0.5px;
    }

    .badge-status {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .status-convocado .badge-status {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--status-convocado);
      color: var(--status-convocado);
    }

    .status-sem-equipe .badge-status {
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid var(--status-sem-equipe);
      color: var(--status-sem-equipe);
    }

    .status-org .badge-status {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--status-org);
      color: var(--status-org);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
    }

    .status-ausente .badge-status {
      background: rgba(100, 116, 139, 0.15);
      border: 1px solid var(--status-ausente);
      color: #94a3b8;
    }

    .turmas-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .turma-tag {
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .tag-ec2 {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--tag-ec2);
      color: var(--tag-ec2);
    }

    .tag-ec4 {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--tag-ec4);
      color: var(--tag-ec4);
    }

    .tag-ec6 {
      background: rgba(129, 140, 248, 0.14);
      border: 1px solid var(--tag-ec6);
      color: #a5b4fc;
    }

    .tag-si2 {
      background: rgba(0, 255, 170, 0.12);
      border: 1px solid var(--tag-si2);
      color: var(--tag-si2);
    }

    .tag-si4 {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid var(--tag-si4);
      color: var(--tag-si4);
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .team-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-blue);
      border-radius: 14px;
      padding: 1.4rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .team-card.org-card {
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
    }

    .team-header {
      border-bottom: 1px solid rgba(0, 195, 255, 0.2);
      padding-bottom: 0.9rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    .team-card.org-card .team-title {
      color: var(--status-org);
    }

    .team-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 119, 255, 0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      border: 1px solid rgba(0, 195, 255, 0.3);
    }

    .team-card.org-card .team-count {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.15);
      color: #fde68a;
    }

    .team-members-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .team-member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: rgba(13, 27, 56, 0.6);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid rgba(0, 195, 255, 0.12);
    }

    .member-name {
      font-weight: 600;
      font-size: 1.02rem;
      color: #fff;
    }

    .empty-team {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 1.5rem 0;
      font-size: 0.95rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1.2rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-blue);
      border-radius: 12px;
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: rgba(139, 162, 196, 0.6);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
  </style>
</head>

    <div class="nav-tabs">

    </div>

    <div class="stats-bar">

      <div class="stat-card convocados">

        <div class="stat-label">Convocados</div>
      </div>
      <div class="stat-card organizacao">

      <div class="stat-card sem-equipe">

      <div class="stat-card ausentes">

      </div>
    </div>

    <!-- ABA 1: PARTICIPANTES -->
    <section id="tab-participantes" class="tab-content active">
      <div class="controls-panel">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome do participante...">

        <div class="filter-groups">

            <button class="btn-filter" data-status="ORGANIZACAO">Organização</button>
            <button class="btn-filter" data-status="SEM_EQUIPE">Sem Equipe</button>
            <button class="btn-filter" data-status="AUSENTE">Ausentes</button>
          </div>

          <div class="filter-section">
            <span class="filter-label">Turma:</span>
            <select id="turmaFilter" class="select-filter">
              <option value="ALL">Todas as Turmas</option>
              <option value="EC - 2º Sem">EC - 2º Semestre (Ciano)</option>
              <option value="EC - 4º Sem">EC - 4º Semestre (Azul)</option>
              <option value="EC - 6º Sem">EC - 6º Semestre (Roxo)</option>
              <option value="SI - 2º Sem">SI - 2º Semestre (Verde)</option>
              <option value="SI - 4º Sem">SI - 4º Semestre (Âmbar)</option>
            </select>
          </div>
        </div>
      </div>

      <main class="players-grid" id="playersGrid"></main>
    </section>

    <!-- ABA 2: EQUIPES -->
    <section id="tab-equipes" class="tab-content">
      <div class="teams-grid" id="teamsGrid"></div>
    </section>

    <footer>
      Copa Tech • Painel Informativo Oficial
    </footer>
  </div>

    function normalizarLista(brutos) {
      const mapa = new Map();

      brutos.forEach(item => {
        const chave = item.nome.trim().toLowerCase();

        if (!mapa.has(chave)) {
          mapa.set(chave, {
            nome: item.nome.trim(),
            turmas: [item.turma],
            status: item.status || "SEM_EQUIPE",
            equipe: item.equipe || ""
          });
        } else {
          const p = mapa.get(chave);
          if (item.turma && !p.turmas.includes(item.turma)) {
            p.turmas.push(item.turma);
          }
          if (item.status === 'ORGANIZACAO' || item.status === 'CONVOCADO') {
            p.status = item.status;
            p.equipe = item.equipe;
          }
        }
      });

      return Array.from(mapa.values()).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    }

    const listaParticipantes = normalizarLista(DADOS_BRUTOS);

    function getTurmaClass(turmaStr) {
      if (turmaStr.includes('EC - 2º')) return 'tag-ec2';
      if (turmaStr.includes('EC - 4º')) return 'tag-ec4';
      if (turmaStr.includes('EC - 6º')) return 'tag-ec6';
      if (turmaStr.includes('SI - 2º')) return 'tag-si2';
      if (turmaStr.includes('SI - 4º')) return 'tag-si4';
      return 'tag-ec2';
    }

    const NOMES_LIDERES = ["Isaac", "Maria Clara", "Pedro Valença", "Yasmin", "Felipe", "Luis"];

    function renderEquipes() {
      const teamsGrid = document.getElementById('teamsGrid');
      
      const membrosOrg = listaParticipantes.filter(p => p.status === 'ORGANIZACAO');
      const orgCardHtml = `
        <div class="team-card org-card">
          <div class="team-header">
            <span class="team-title">⚡ Equipe Organizadora</span>
            <span class="team-count">${membrosOrg.length} membros</span>
          </div>
          <ul class="team-members-list">
            ${membrosOrg.map(m => {
              const tags = m.turmas.map(t => `<span class="turma-tag ${getTurmaClass(t)}">${t}</span>`).join(' ');
              return `
                <li class="team-member-item">
                  <span class="member-name">${m.nome}</span>
                  <div class="turmas-wrapper">${tags}</div>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      `;

      const equipesCardsHtml = NOMES_LIDERES.map(lider => {
        const membros = listaParticipantes.filter(p => p.status === 'CONVOCADO' && p.equipe === lider);
        
        let listaHtml = '';
        if (membros.length === 0) {
          listaHtml = `<div class="empty-team">Nenhum participante convocado no momento.</div>`;
        } else {
          listaHtml = `
            <ul class="team-members-list">
              ${membros.map(m => {
                const tags = m.turmas.map(t => `<span class="turma-tag ${getTurmaClass(t)}">${t}</span>`).join(' ');
                return `
                  <li class="team-member-item">
                    <span class="member-name">${m.nome}</span>
                    <div class="turmas-wrapper">${tags}</div>
                  </li>
                `;
              }).join('')}
            </ul>
          `;
        }

        return `
          <div class="team-card">
            <div class="team-header">
              <span class="team-title">Líder: ${lider}</span>
              <span class="team-count">${membros.length} escalado(s)</span>
            </div>
            ${listaHtml}
          </div>
        `;
      }).join('');

      teamsGrid.innerHTML = orgCardHtml + equipesCardsHtml;
    }

    let currentStatusFilter = 'ALL';
    let currentTurmaFilter = 'ALL';
    let searchQuery = '';

    const gridEl = document.getElementById('playersGrid');
    const searchInput = document.getElementById('searchInput');
    const turmaSelect = document.getElementById('turmaFilter');
    const statusBtns = document.querySelectorAll('.btn-filter');

    const totalCountEl = document.getElementById('totalCount');
    const convocadosCountEl = document.getElementById('convocadosCount');
    const orgCountEl = document.getElementById('orgCount');
    const semEquipeCountEl = document.getElementById('semEquipeCount');
    const ausentesCountEl = document.getElementById('ausentesCount');

    function updateStats() {
      totalCountEl.textContent = listaParticipantes.length;
      convocadosCountEl.textContent = listaParticipantes.filter(p => p.status === 'CONVOCADO').length;
      orgCountEl.textContent = listaParticipantes.filter(p => p.status === 'ORGANIZACAO').length;
      semEquipeCountEl.textContent = listaParticipantes.filter(p => p.status === 'SEM_EQUIPE').length;
      ausentesCountEl.textContent = listaParticipantes.filter(p => p.status === 'AUSENTE').length;
    }

    function getStatusLabel(p) {
      if (p.status === 'ORGANIZACAO') return 'Organização';
      if (p.status === 'CONVOCADO') return p.equipe ? `Convocado: ${p.equipe}` : 'Convocado';
      if (p.status === 'AUSENTE') return 'Ausente';
      return 'Sem Equipe';
    }

    function renderParticipantes() {
      const filtrados = listaParticipantes.filter(p => {
        const matchNome = p.nome.toLowerCase().includes(searchQuery.toLowerCase());
        const matchStatus = (currentStatusFilter === 'ALL') || (p.status === currentStatusFilter);
        const matchTurma = (currentTurmaFilter === 'ALL') || (p.turmas.includes(currentTurmaFilter));
        return matchNome && matchStatus && matchTurma;
      });

      if (filtrados.length === 0) {
        gridEl.innerHTML = `
          <div class="no-results">
            Nenhum participante encontrado com os filtros selecionados.
          </div>
        `;
        return;
      }

      gridEl.innerHTML = filtrados.map(p => {
        let statusClass = 'status-sem-equipe';
        if (p.status === 'ORGANIZACAO') statusClass = 'status-org';
        else if (p.status === 'CONVOCADO') statusClass = 'status-convocado';
        else if (p.status === 'AUSENTE') statusClass = 'status-ausente';

        const labelStatus = getStatusLabel(p);
        const tags = p.turmas.map(t => `<span class="turma-tag ${getTurmaClass(t)}">${t}</span>`).join(' ');

        return `
          <div class="player-card ${statusClass}">
            <div class="player-header">
              <span class="player-name">${p.nome}</span>
              <span class="badge-status">${labelStatus}</span>
            </div>
            <div class="turmas-wrapper">
              ${tags}
            </div>
          </div>
        `;
      }).join('');
    }

    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderParticipantes();
    });

    turmaSelect.addEventListener('change', (e) => {
      currentTurmaFilter = e.target.value;
      renderParticipantes();
    });

    statusBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        statusBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatusFilter = btn.dataset.status;
        renderParticipantes();
      });
    });

    updateStats();
    renderParticipantes();
    renderEquipes();
